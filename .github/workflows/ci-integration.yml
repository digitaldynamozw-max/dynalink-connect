name: CI - Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run unit & integration tests
        run: |
          node --import tsx --test tests/order-fees.test.ts
          node --import tsx --test tests/driver-wallet.test.ts
          node --import tsx --test tests/integration/checkout-courier-settlement.test.ts
      - name: Optional Playwright e2e (skipped unless E2E_BASE_URL)
        if: env.E2E_BASE_URL
        run: npx playwright test --config=playwright.config.ts tests/e2e
